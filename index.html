<div style="background:#000;border:2px solid #fff;border-radius:8px;padding:12px;font-family:'Courier New',monospace;color:#fff;max-width:700px;margin:0 auto;">
<h2 class="sr-only">Retro black and white space invaders game where the aliens are teeth and the UFO is a chocolate bar, controlled with arrow keys, with a time limit.</h2>
<div style="display:flex;justify-content:space-between;font-size:13px;letter-spacing:1px;margin-bottom:6px;">
<span>SCORE: <span id="score">0</span></span>
<span id="status">USE ARROW KEYS</span>
<span>TIME: <span id="time">60</span></span>
</div>
<canvas id="cv" width="660" height="460" style="background:#000;display:block;width:100%;image-rendering:pixelated;border:1px solid #555;"></canvas>
<div style="text-align:center;font-size:11px;color:#aaa;margin-top:6px;">LEFT / RIGHT: MOVE — UP: SHOOT — R: RESTART</div>
</div>
<script>
(function(){
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=660,H=460;
let scoreEl=document.getElementById('score');
let timeEl=document.getElementById('time');
let statusEl=document.getElementById('status');

let audioCtx=null;
function beep(freq,dur,type){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type||'square';
    o.frequency.value=freq;
    g.gain.value=0.06;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

let keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
  keys[e.key]=true;
  if(e.key==='r'||e.key==='R') initGame();
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

let player, bullets, teeth, enemyBullets, ufo, score, timeLeft, gameOver, lastShot, lastUfoSpawn, frame, teethDir, win;

function makeTeeth(){
  const arr=[];
  const rows=4, cols=8;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      arr.push({x:60+c*65, y:50+r*45, alive:true, w:34, h:28});
    }
  }
  return arr;
}

function initGame(){
  player={x:W/2-20,y:H-40,w:40,h:16,speed:5};
  bullets=[];
  enemyBullets=[];
  teeth=makeTeeth();
  teethDir=1;
  ufo=null;
  score=0;
  timeLeft=60;
  gameOver=false;
  win=false;
  lastShot=0;
  lastUfoSpawn=0;
  frame=0;
  statusEl.textContent='GOOD LUCK';
  scoreEl.textContent=score;
  timeEl.textContent=timeLeft;
}

function drawTooth(t){
  if(!t.alive) return;
  ctx.save();
  ctx.translate(t.x,t.y);
  ctx.fillStyle='#fff';
  ctx.strokeStyle='#fff';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(2,4);
  ctx.quadraticCurveTo(0,18,8,t.h-2);
  ctx.quadraticCurveTo(t.w/2,t.h+6,t.w-8,t.h-2);
  ctx.quadraticCurveTo(t.w,18,t.w-2,4);
  ctx.quadraticCurveTo(t.w/2,-6,2,4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#000';
  ctx.fillRect(t.w/2-7,8,4,5);
  ctx.fillRect(t.w/2+3,8,4,5);
  ctx.restore();
}

function drawChocolate(u){
  ctx.save();
  ctx.translate(u.x,u.y);
  ctx.fillStyle='#fff';
  ctx.strokeStyle='#fff';
  ctx.lineWidth=1;
  ctx.fillRect(0,0,u.w,u.h);
  ctx.strokeStyle='#000';
  for(let i=1;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(i*u.w/4,0);
    ctx.lineTo(i*u.w/4,u.h);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(0,u.h/2);
  ctx.lineTo(u.w,u.h/2);
  ctx.stroke();
  ctx.restore();
}

function drawPlayer(){
  ctx.fillStyle='#fff';
  ctx.fillRect(player.x+player.w/2-3,player.y-8,6,8);
  ctx.fillRect(player.x,player.y,player.w,player.h);
}

function update(){
  if(gameOver) return;
  frame++;

  if(keys['ArrowLeft']) player.x-=player.speed;
  if(keys['ArrowRight']) player.x+=player.speed;
  player.x=Math.max(0,Math.min(W-player.w,player.x));

  if(keys['ArrowUp'] && frame-lastShot>14){
    bullets.push({x:player.x+player.w/2-2,y:player.y,w:4,h:10});
    lastShot=frame;
    beep(880,0.06,'square');
  }

  bullets.forEach(b=>b.y-=8);
  bullets=bullets.filter(b=>b.y>-20);

  enemyBullets.forEach(b=>b.y+=4);
  enemyBullets=enemyBullets.filter(b=>b.y<H+20);

  const aliveTeeth=teeth.filter(t=>t.alive);
  let edgeHit=false;
  aliveTeeth.forEach(t=>{
    t.x+=teethDir*(0.6+score*0.002);
    if(t.x<10||t.x+t.w>W-10) edgeHit=true;
  });
  if(edgeHit){
    teethDir*=-1;
    aliveTeeth.forEach(t=>t.y+=14);
  }

  if(frame%70===0 && aliveTeeth.length>0){
    const shooter=aliveTeeth[Math.floor(Math.random()*aliveTeeth.length)];
    enemyBullets.push({x:shooter.x+shooter.w/2-2,y:shooter.y+shooter.h,w:4,h:10});
  }

  if(!ufo && frame-lastUfoSpawn>240){
    if(Math.random()<0.02){
      ufo={x:-60,y:30,w:50,h:24,speed:2.2};
      lastUfoSpawn=frame;
    }
  }
  if(ufo){
    ufo.x+=ufo.speed;
    if(ufo.x>W+60) ufo=null;
  }

  bullets.forEach(b=>{
    aliveTeeth.forEach(t=>{
      if(t.alive && b.x<t.x+t.w && b.x+b.w>t.x && b.y<t.y+t.h && b.y+b.h>t.y){
        t.alive=false;
        b.y=-999;
        score+=10;
        beep(220,0.1,'sawtooth');
      }
    });
    if(ufo && b.x<ufo.x+ufo.w && b.x+b.w>ufo.x && b.y<ufo.y+ufo.h && b.y+b.h>ufo.y){
      score+=50;
      ufo=null;
      b.y=-999;
      beep(150,0.25,'sawtooth');
    }
  });
  bullets=bullets.filter(b=>b.y>-500);

  enemyBullets.forEach(b=>{
    if(b.x<player.x+player.w && b.x+b.w>player.x && b.y<player.y+player.h && b.y+b.h>player.y){
      gameOver=true;
      statusEl.textContent='GAME OVER - PRESS R';
      beep(80,0.4,'sawtooth');
    }
  });

  aliveTeeth.forEach(t=>{
    if(t.y+t.h>player.y) {
      gameOver=true;
      statusEl.textContent='GAME OVER - PRESS R';
    }
  });

  if(aliveTeeth.length===0){
    win=true;
    gameOver=true;
    statusEl.textContent='ALL CLEAR! PRESS R';
  }

  scoreEl.textContent=score;

  if(frame%60===0 && timeLeft>0){
    timeLeft--;
    timeEl.textContent=timeLeft;
    if(timeLeft<=0){
      gameOver=true;
      statusEl.textContent='TIME UP - PRESS R';
      beep(100,0.5,'sawtooth');
    }
  }
}

function render(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';
  for(let i=0;i<40;i++){
    const sx=(i*53+frame*0.2)%W;
    const sy=(i*97)%H;
    ctx.fillRect(sx,sy,1,1);
  }

  teeth.forEach(drawTooth);
  if(ufo) drawChocolate(ufo);
  drawPlayer();

  ctx.fillStyle='#fff';
  bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    ctx.font='bold 28px monospace';
    ctx.textAlign='center';
    ctx.fillText(win?'ALL CLEAR':'GAME OVER',W/2,H/2-10);
    ctx.font='16px monospace';
    ctx.fillText('SCORE: '+score,W/2,H/2+20);
    ctx.font='12px monospace';
    ctx.fillText('PRESS R TO RESTART',W/2,H/2+45);
  }
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

initGame();
loop();
})();
</script>
